source: >-
  openapi/skydance-media-content-openapi.yml (derived from https://skydance.com/wp-json/)
  plus live response headers observed on GET /wp-json/wp/v2/posts and /wp/v2/pages, 2026-08-05
api: skydance-media:content
authentication:
  anonymous_read: true
  scheme: WordPress Application Passwords over HTTP Basic
  browser_scheme: logged-in cookie + X-WP-Nonce header
  developer_signup: null
  note: >-
    Skydance Media runs no developer program, so no third party can obtain a credential.
    Treat this API as read-only in practice.
  artifact: authentication/skydance-media-authentication.yml
idempotency:
  supported: false
  note: >-
    No idempotency key header or parameter is exposed on any route in the discovery document,
    and none is documented. No Idempotency pointer is wired in apis.yml — the provider has no
    idempotency contract to advertise.
pagination:
  style: page-number
  request_params:
  - {name: page, type: integer, default: 1, minimum: 1}
  - {name: per_page, type: integer, default: 10, minimum: 1, maximum: 100}
  - {name: offset, type: integer, note: available on collection routes}
  response_headers:
  - {name: X-WP-Total, meaning: total items in the collection}
  - {name: X-WP-TotalPages, meaning: total pages at the current per_page}
  link_header: 'RFC 8288 Link header with rel="next" / rel="prev"'
  observed: 'GET /wp/v2/pages?per_page=1 -> X-WP-Total: 46; GET /wp/v2/media?per_page=1 -> X-WP-Total: 5431'
  caveat: >-
    X-WP-Total is a count of the query, not of the payload. On /wp/v2/media the default
    date/desc ordering returns an empty array against a total of 5431 because the newest
    attachments hang off non-REST custom post types. Do not treat the header as a promise
    that the page is non-empty.
field_selection:
  sparse_fields:
    param: _fields
    note: comma-separated list of top-level fields to return
  expansion:
    param: _embed
    note: >-
      Inlines linked resources (author, featured media, terms, replies) into _embedded,
      driven by the _links relations each resource carries.
  context:
    param: context
    values: [view, embed, edit]
    default: view
    note: edit context requires authentication
ordering_and_filtering:
  params: [search, order, orderby, slug, status, after, before, modified_after, modified_before,
