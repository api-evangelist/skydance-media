aid: skydance-media
name: Skydance Media
description: 'Skydance Media is a Santa Monica, California diversified entertainment
  company founded in 2010 by David Ellison, producing event-scale film, television,
  animation, sports and interactive entertainment — Top Gun: Maverick, the Mission:
  Impossible films, Reacher, Grace and Frankie, Spellbound, and the VR titles The Walking
  Dead: Saints & Sinners and Behemoth through Skydance Interactive and Skydance New
  Media. Skydance completed its merger with Paramount Global on 7 August 2025 to form
  Paramount Skydance Corporation, and skydance.com continues to operate as the label
  site for the Animation, Film, Television, Sports, Interactive and New Media divisions.
  Skydance publishes no developer program, no API documentation, no SDK and no OpenAPI
  of its own. The only machine-readable, anonymously readable surface on its own host
  is the WordPress REST API at skydance.com/wp-json — the CMS content API behind the
  label site, which serves pages, the media library, categories and site search as JSON.'
