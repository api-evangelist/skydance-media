apis:
- aid: skydance-media:content
  name: Skydance Media Content API (WordPress REST wp/v2)
  description: 'The anonymously readable WordPress REST API that skydance.com serves at
    /wp-json/wp/v2 — marketing and legal pages, the media library, categories, tags,
    comments, post types and a site-wide search endpoint, returned as JSON with
    page/per_page pagination and X-WP-Total / X-WP-TotalPages headers. This is the CMS
    content API, not a Skydance product API; Skydance publishes no OpenAPI for it, so the
    definition in this repo was derived mechanically from the live route-discovery
    document at https://skydance.com/wp-json/. The site''s film, television, animation,
    sports and interactive catalog lives in custom post types that are NOT registered with
    the REST API — GET /wp/v2/posts returns a single 2015 placeholder post — so the
    readable content is pages, media and taxonomy, not the title catalog.'
  humanURL: https://skydance.com/
  baseURL: https://skydance.com/wp-json/wp/v2
