quirks:
- operation: getMedia
  observed: >-
    GET /wp/v2/media?per_page=1 returns HTTP 200 with an empty array while the response
    carries X-WP-Total: 5431 and X-WP-TotalPages: 5431. Adding orderby=id&order=asc returns
    real attachments.
  reading: >-
    The newest attachments are attached to custom post types that are not REST-registered, so
    they are counted by the query but filtered from the payload. Walk the library with
    orderby=id&order=asc rather than the default date/desc.
